<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="frontend/css/event.css">
</head>
<body>


  <div id="nav-container"></div>

  <main>
    <div class="toolbar">
      <label>Sort
        <select id="sort">
          <option value="date">Date</option>
          <option value="title">Title</option>
          <option value="category">Category</option>
        </select>
      </label>
    </div>
    <section class="events-grid" id="events-grid"></section>
  </main>


  <div id="footer-container"></div>

  <script src="script/main.js"></script>
  <script src="script/events.js"></script>


  <script>
    // Load Navbar
    fetch('navPlaceholder.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('nav-container').innerHTML = html;
      });

    // Load Footer
    fetch('footerPlaceholder.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('footer-container').innerHTML = html;
      });
  </script>
</body>
</html>
