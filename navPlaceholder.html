<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hnpgnp navbar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@300&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #fff6e5;
      --red: #b3262b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #1e1e1e; 
      font-family: system-ui, sans-serif;
    }

    /* base size upto 767px */
    .nav {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--cream);
      padding: 0.35rem 0.6rem;
      border: 1px solid rgba(0, 0, 0, 0.25);
      font-family: "Stack Sans Headline", system-ui, sans-serif;
      font-weight: 300;
    }

    .nav__logo img { height: 1rem; display: block; }

    .nav__toggle {
      display: flex;
      flex-direction: column;
      gap: 3px;
      background: none;
      border: 0;
      padding: 0.25rem;
      cursor: pointer;
    }
    .nav__toggle span {
      width: 14px;
      height: 2px;
      background: var(--red);
    }
    .nav__toggle:focus-visible,
    .nav a:focus-visible {
      outline: 2px solid var(--red);
      outline-offset: 2px;
    }

    .nav__menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0.75rem;
      padding: 1rem;
      background: var(--cream);
      border: 1px solid rgba(0, 0, 0, 0.25);
      border-top: 0;
    }
    .nav__menu.is-open { display: flex; }

    .nav__links {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .nav a {
      color: var(--red);
      text-decoration: none;
      font-size: 0.85rem;
    }

    /* 768px: larger bar, still sidebar*/
    @media (min-width: 768px) {
      .nav { padding: 0.5rem 1rem; }
      .nav__logo img { height: 1.4rem; }
      .nav__toggle { gap: 4px; }
      .nav__toggle span { width: 20px; }
      .nav a { font-size: 1rem; }
    }

    /* 1200px: full nav */
    @media (min-width: 1200px) {
      /* logo left | links centered | login right */
      .nav {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        padding: 0.6rem 1.5rem;
      }
      .nav__logo { justify-self: start; }
      .nav__logo img { height: 1.6rem; }
      .nav__toggle { display: none; }

      .nav__menu {
        display: contents;
      }
      .nav__links {
        flex-direction: row;
        justify-content: center;
        gap: 2rem;
      }
      .nav__login { justify-self: end; }
    }
  </style>
</head>
<body>

  <header class="nav">
    <a href="/" class="nav__logo"><img src="frontend/vectors/logoRedBlue.svg" alt="hnpgnp"></a>

    <button class="nav__toggle" aria-label="Menu" aria-expanded="false" aria-controls="nav-menu">
      <span></span><span></span><span></span>
    </button>

    <nav id="nav-menu" class="nav__menu">
      <ul class="nav__links">
        <li><a href="/team">the team</a></li>
        <li><a href="/events">events</a></li>
        <li><a href="/features">features</a></li>
      </ul>
      <a href="/login" class="nav__login">log in/sign up</a>
    </nav>
  </header>

  <script>
    const toggle = document.querySelector('.nav__toggle');
    const menu = document.querySelector('.nav__menu');

    toggle.addEventListener('click', () => {
      const open = menu.classList.toggle('is-open');
      toggle.setAttribute('aria-expanded', open);
    });
  </script>
</body>
</html>
