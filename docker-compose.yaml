services:
  app:
    build: ./Backend
    container_name: HanapGanap
    env_file:
      - ./Backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/HanapGanap
      - NODE_ENV=development
      - PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./Backend:/app
      - /app/node_modules
      - ./Frontend:/Frontend

  db:
    image: postgres:13-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: HanapGanap
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d HanapGanap"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: