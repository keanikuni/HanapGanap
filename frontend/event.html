<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/event.css">
</head>
<body>

  <!-- DITO MAGLO-LOAD ANG NAV -->
  <div id="nav-container"></div>
 
  <main>
    <section class="event">
      <div class="event-image" id="event-image"></div>
      <div class="event-info">
        <h1 id="event-title">Event Name</h1>
        <p id="event-location">Location</p>
        <p id="event-date"></p>
        <p id="event-category"></p>
        <p id="event-organizer"></p>
        <p id="event-university"></p>
        <p id="event-status"></p>
      </div>
      <p class="event-desc" id="event-desc">Event Description</p>
    </section>
  </main>

  <!-- DITO MAGLO-LOAD ANG FOOTER -->
  <div id="footer-container"></div>

  <script src="script/main.js"></script>
  <script src="script/event.js"></script>


  <script>
    // Load Navbar
    fetch('navPlaceholder.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('nav-container').innerHTML = html;
      });

    // Load Footer
    fetch('footerPlaceholder.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('footer-container').innerHTML = html;
      });
  </script>
</body>
</html>
