<!--this is in student's dashboard page (possibly or redirects as a hyperlink/anchor)-->
<!--include at head-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!--include at .js file-->
<script>

    const jwt = localStorage.getItem('token');

    async function loadQR() {
        //bearer jwt is taking the json web token to confirm is the user is logged in? might omit if the qr is relocated to student dashboard
        const res = await fetch ('api/auth/me', {
            method: 'GET',
            headers: {
            Authorization: `Bearer ${jwt}`
            }
        })

        if (!res.ok) return (document.getElementById('msg').textContent = 'Please log in again');

        const me = await res.json();

        if (!me.student) return (document.getElementById('mssg').textContent = 'Only students have QR Codes');

        new QRCode(document.getElementById('qrcode'),{
            text: me.student.qrToken,
            width: 240,
            height: 240
        })
    }
    loadQR();

</script>

<h2></h2>
<div id="qrcode"></div>
<p id="msg"></p>
