<h1>My Profile</h1>
<a href="#" id="logout">Log out</a>
<p id="msg"></p>

<section id="profile"></section>

<section id="studentArea" hidden>
  <h2>My QR Code</h2>
  <div id="qrcode"></div>

  <h2>My Certificates</h2>
  <ul id="certList"></ul>
  <p id="certMsg"></p>
</section>

<section id="organizerArea" hidden>
  <h2>My Events</h2>
  <ul id="eventList"></ul>
  <p id="eventMsg"></p>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  const jwt = localStorage.getItem('token');             // same key as your login page
  const auth = { Authorization: 'Bearer ' + jwt };
  const fmt = (d) => new Date(d).toLocaleDateString('en-PH', { dateStyle: 'long' });

  // small helper: add a "Label: value" line using textContent (safe from injected HTML)
  function addLine(parent, label, value) {
    if (!value) return;
    const p = document.createElement('p');
    p.textContent = `${label}: ${value}`;
    parent.appendChild(p);
  }

  async function init() {
    if (!jwt) return (location.href = '/login.html');    // your login page

    const res = await fetch('/api/auth/me', { headers: auth });
    if (res.status === 401) {
      localStorage.removeItem('token');
      return (location.href = '/login.html');
    }
    const me = await res.json();

    renderProfile(me);
    if (me.role === 'student')   showStudentArea(me);
    if (me.role === 'organizer') showOrganizerArea(me);
  }

  // ── Profile card (everyone) ─────────────────────────────
  function renderProfile(me) {
    const box = document.getElementById('profile');
    addLine(box, 'Name', me.fullName);
    addLine(box, 'Email', me.email);
    addLine(box, 'Role', me.role);

    if (me.student) {
      addLine(box, 'University', me.student.university?.name);
      addLine(box, 'Student number', me.student.studentNumber);
      addLine(box, 'Program', me.student.courseProgram);
      addLine(box, 'Year level', me.student.yearLevel);
    }
    if (me.organizer) addLine(box, 'Organization', me.organizer.orgName);
    if (me.guest) {
      addLine(box, 'Contact number', me.guest.contactNumber);
      addLine(box, 'School / affiliation', me.guest.schoolOrAffiliation);
    }
  }

  // ── Student: QR + certificates ──────────────────────────
  async function showStudentArea(me) {
    document.getElementById('studentArea').hidden = false;

    new QRCode(document.getElementById('qrcode'), {
      text: me.student.qrToken, width: 220, height: 220
    });

    const res = await fetch('/api/registrations/mine', { headers: auth });
    const regs = await res.json();
    const certs = regs.filter((r) => r.certificateAvailable);

    const list = document.getElementById('certList');
    if (certs.length === 0) {
      document.getElementById('certMsg').textContent =
        'No certificates yet. They appear after an event ends and you were checked in.';
      return;
    }
    for (const r of certs) {
      const li = document.createElement('li');
      li.textContent = `${r.event.title} (${fmt(r.event.startDatetime)}) `;
      const btn = document.createElement('button');
      btn.textContent = 'Download';
      btn.onclick = () => downloadCertificate(r.event.id, r.event.title, btn);
      li.appendChild(btn);
      list.appendChild(li);
    }
  }

  async function downloadCertificate(eventId, title, btn) {
    btn.disabled = true;
    try {
      const res = await fetch(`/api/events/${eventId}/certificate`, { headers: auth });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        document.getElementById('msg').textContent = err.message || 'Could not get the certificate.';
        return;
      }
      const url = URL.createObjectURL(await res.blob());
      const a = document.createElement('a');
      a.href = url;
      a.download = `Certificate - ${title}.pdf`;
      a.click();
      URL.revokeObjectURL(url);
    } finally {
      btn.disabled = false;
    }
  }

  // ── Organizer: my events ────────────────────────────────
  async function showOrganizerArea(me) {
    document.getElementById('organizerArea').hidden = false;

    const all = await (await fetch('/api/events')).json();
    const mine = all.filter((e) => e.organizer.id === me.organizer.id);

    const list = document.getElementById('eventList');
    if (mine.length === 0) {
      document.getElementById('eventMsg').textContent = 'You have no events yet.';
      return;
    }
    for (const e of mine) {
      const li = document.createElement('li');
      li.textContent =
        `${e.title} | ${fmt(e.startDatetime)} | ${e.status} | ` +
        `${e._count.registrations}/${e.participantLimit} registered `;

      if (['upcoming', 'ongoing'].includes(e.status)) {
        const scan = document.createElement('a');
        scan.textContent = 'Scan attendance';
        scan.href = `scanner.html?eventId=${e.id}`;       // adjust to your scanner path
        li.appendChild(scan);
      }
      list.appendChild(li);
    }
  }

  document.getElementById('logout').onclick = (ev) => {
    ev.preventDefault();
    localStorage.removeItem('token');
    location.href = '/login.html';
  };

  init();
</script>
