<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hnpgnp | Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Stack+Sans+Headline:wght@200..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/footer.css">
<body>

  <nav id="navBar">
        <div id="NAVcontainer">
            <div id="NAVlogo"><a href="index.html"><img src="vectors/logoRedBlue.svg"></a></div>
            <button id="NAVmenuToggle" type="button" aria-label="Toggle navigation" aria-controls="navMenu" aria-expanded="false" onclick="toggleMenu()">&#9776;</button>
            <div id="NAVMenu">
                <ul class="NAVmainNav" id="NAVmainNavID">
                    <li id="NAVteam"><a href="team.html"><h2 class="NAVh2">the team</h2></a></li>
                    <li id="NAVevents"><a href="events.html"><h2 class="NAVh2">events</h2></a></li>
                    <li id="NAVfeatures"><a href="features.html"><h2 class="NAVh2">features</h2></a></li>
                </ul>
                <div id="NAVaccount">
                    <a href="signup.html" id="accountLink">
                        <h2 class="NAVh2">account</h2>
                    </a>
                </div>
            </div>
        </div>
    </nav>
<div id="backButtonDiv" style="
        position: fixed;
        padding-left: 1%;
        padding-top: 5%;
        z-index: 1000;
    ">
        <button id="backButtonUniversal"
            type="button"
            aria-label="Go back"
            data-fallback="dashboard_organizer.html"
            style="
                font-family: 'Stack Sans Headline';
                font-size: 24px;
                background-color: #829BD3;
                border-radius: 100px;
                border: none;
                padding-inline: 10px;
                cursor: pointer;
            ">&#171; Back</button>
    </div>

  <main class="pageMain">
    <p id="status" class="statusMessage" aria-live="polite"></p>

    <!-- LOG IN -->
    <section id="loginSection" class="authSection">
      <h1 class="authTitle">welcome back! ready to find events?</h1>
      <form id="loginForm" class="authForm" novalidate>
        <div class="fieldGroup">
          <label for="loginEmail" class="visuallyHidden">Email</label>
          <input type="email" id="loginEmail" name="email" class="fieldInput" placeholder="Email" autocomplete="email" aria-describedby="loginEmailError">
          <div class="fieldError" id="loginEmailError"></div>
        </div>

        <div class="fieldGroup">
          <label for="loginPassword" class="visuallyHidden">Password</label>
          <input type="password" id="loginPassword" name="password" class="fieldInput" placeholder="Password" autocomplete="current-password" aria-describedby="loginPasswordError">
          <div class="fieldError" id="loginPasswordError"></div>
        </div>

        <div class="fieldError" id="loginFormError" role="alert"></div>
        <button type="submit" class="pillButton"><span class="labelMobile">Enter</span><span class="labelDesktop">Log In</span></button>
      </form>
      <p class="switchPrompt">no account yet? <a href="signup.html">sign up</a></p>
    </section>

    <!-- LOGGED IN VIEW -->
    <section id="welcomeSection" class="authSection" hidden>
      <h1 class="authTitle" id="welcomeTitle">you're in!</h1>
      <p class="welcomeText" id="welcomeText"></p>
      <a href="events.html" id="continueLink" class="pillButton">Continue</a>
      <button type="button" id="logoutBtn" class="pillButton">Log out</button>
    </section>
    </main>

  <footer class="footer">
    <nav class="footer__nav" aria-label="Footer">
    <div class="footer__group">
        <h2>explore</h2>
        <ul>
            <li><a href="events.html">events</a></li>
            <li><a href="team.html">the team</a></li>
            <li><a href="features.html">features</a></li>
            <li><a href="login.html">log in/sign up</a></li>
        </ul>
    </div>

    <div class="footer__group">
        <h2>about</h2>
        <ul>
            <li><a href="termsofservice.html">Terms of Service</a></li>
            <li><a href="privacypolicy.html">Privacy Policy</a></li>
        </ul>
    </div>

    <div class="footer__group">
        <h2>say hi!</h2>
        <ul>
        <li><a href="facebook.com">facebook</a></li>
        <li><a href="instagram.com">instagram</a></li>
        </ul>
    </div>
    </nav>

    <div class="footer__wordmark">
    <img src="vectors/logoWarmWhite.svg" alt="HanapGanap">
    </div>
</footer>
<div class="footer__base"></div>

  <script src="script/main.js"></script>
  <script src="script/auth.js"></script>
  <script src="script/login.js"></script>
  <script src="script/backButton.js" defer></script>
</body>
</html>
